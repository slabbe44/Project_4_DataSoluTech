services:
  mongodb:
    image: mongo:8.0
    container_name: datasolutech_mongodb

    ports:
      - "127.0.0.1:27018:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migration:
    build: .

    depends_on:
      mongodb:
        condition: service_healthy

    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    volumes:
      - ./data:/app/data:ro

volumes:
  mongo_data:

